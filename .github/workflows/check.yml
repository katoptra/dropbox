# This workflow uses the check workflow of lib, on one runner with one pull of the image.
# It makes a render of the pipeline and compares it with render.txt. Then it runs the
# offline verb: the tests and the lint.
name: check
on: {pull_request: {}}
permissions: {contents: read}
jobs:
  check:
    uses: katoptra/lib/.github/workflows/check.yml@e18ef7d810f0a239a7f6908f55060d8e0f40ce2c # v2.6.1
    with: {offline: true}
