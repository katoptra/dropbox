# One runner, one image pull: the render diff, the tests and the lint.
name: check
on: {pull_request: {}}
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: katoptra/lib/.github/actions/toolbox@7b7d11758b263a74bb6ac5e20a062711105d7c10 # v2.0.1
      - run: task check
      - run: task test
      - run: task lint
