name: sync
on:
  workflow_dispatch:
    inputs:
      vars:
        description: 'KEY=value pairs for the pipeline, e.g. "RECONCILE=true RUN_BUDGET_MIN=30"'
        type: string
        default: ''
permissions:
  contents: read
  actions: write   # the called workflow chains the next run; a called workflow cannot raise this
concurrency: {group: sync, cancel-in-progress: false}
jobs:
  sync:
    uses: katoptra/lib/.github/workflows/sync.yml@fe8162386f612ddb4e5c886632fa7a8d74c54d9f # v2.2.0
    with: {vars: '${{ inputs.vars }}'}
    secrets: inherit
