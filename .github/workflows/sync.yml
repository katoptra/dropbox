name: sync
on:
  workflow_dispatch:
    inputs:
      vars:
        description: 'KEY=value pairs for the pipeline, e.g. "RECONCILE=true RUN_BUDGET_MIN=30"'
        type: string
        default: ''
permissions:
  contents: read
  actions: write   # the called workflow chains the next run; a called workflow cannot raise this
concurrency: {group: sync, cancel-in-progress: false}
jobs:
  sync:
    uses: katoptra/lib/.github/workflows/sync.yml@f6343cde2c841df1f963370dd719b2a1006a8457 # v2.1.3
    # run_budget_minutes in config/mirror.toml is 335, 20 minutes less than this timeout.
    # Thus, the upload of the last batch and the report finish before the timeout.
    with: {vars: '${{ inputs.vars }}', timeout-minutes: 355}
    secrets: inherit
