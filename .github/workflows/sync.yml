name: sync
on:
  workflow_dispatch:
    inputs:
      vars:
        description: 'KEY=value pairs for the pipeline, e.g. "RECONCILE=true RUN_BUDGET_MIN=30"'
        type: string
        default: ''
permissions:
  contents: read
  # The sync workflow of lib starts the next run if a run writes .run/chain. But the
  # workflow of lib cannot have more permissions than this workflow gives it.
  actions: write
concurrency: {group: sync, cancel-in-progress: false}
jobs:
  sync:
    uses: katoptra/lib/.github/workflows/sync.yml@36d75e6b21473400b5b15003025d9a2e81d4eeea # v2.6.0
    # run_budget_minutes in config/mirror.toml is 335, 20 minutes less than this timeout.
    # Thus, the run uploads the last batch and writes the report before the timeout.
    with: {vars: '${{ inputs.vars }}', timeout-minutes: 355}
    secrets: inherit
