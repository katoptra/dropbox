# The one behavior input. Runtime paths, secrets and the account identifiers
# (MIRROR_DROPBOX_ACCOUNT_ID, MIRROR_PROTON_DESTINATION, MIRROR_PROTON_DESTINATION_UID)
# come from the environment; see op.env.
[mirror]
# The primary key of the state in R2; every run row references it. The repository
# is katoptra/dropbox, but this value is the state's and never changes.
id = "dropbox-mirror"

[dropbox]
root = ""
page_limit = 2000
minimum_call_interval_seconds = 0.1
# Small-file fetch is bound by Dropbox's first-byte latency per connection, not by
# the shared 0.1 s call spacing, which caps the pool at ten files a second.
download_workers = 8

[budget]
batch_gb = 4
# Measured: 1,000 files uploaded in about 650 s, about 0.65 s per file. 2,000 files
# costs roughly 22 minutes of run_budget_minutes.
batch_files = 2000
# A file over this is left out of every plan: a GitHub runner guarantees 14 GB of
# disk, the staging of one file needs the file plus disk_headroom_gb, and the state
# and image share the same disk. The report counts what was left out.
max_file_gb = 12
# Just under GitHub's six-hour job limit: each run pays one image pull, one Dropbox
# listing and one unused tail of up to a batch, so fewer, longer runs waste less.
# sync.yml's timeout-minutes must stay 20 minutes above this.
run_budget_minutes = 335
ceiling_gb = 4000
disk_headroom_gb = 1
listing_floor_ratio = 0.5

[proton]
# The reconcile walk is one `filesystem list` process per folder; this many run at once,
# each from its own copy of the CLI session. Eight matches dropbox.download_workers.
walk_workers = 8
# `filesystem upload` processes per batch, each over its own top-level staging entries
# from its own copy of the session. One process uploads at about 12.8 MB/s plus 0.2 s
# per file, well under the link; UPLOAD_WORKERS after the double dash tries more for
# one run before this is raised.
upload_workers = 1

[reconcile]
weekday = 0
