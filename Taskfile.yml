# dropbox: nightly Dropbox -> Proton Drive mirror run from GitHub Actions.
#
# Invariant: every step runs inside the toolbox image, on a laptop and in CI
# alike, and R2 holds the only record of how far the mirror has got. Secrets
# reach processes by name from 1Password (op.env); nothing is written to disk.
#
# The toolbox, which starts a run, contains it in the image, resolves its secrets,
# renders and checks it, reports it and pings healthchecks.io, is katoptra/lib's,
# included below at v2 and flattened into this file. What is here is the mirror's
# own: the pipeline in order, one migrator command a step beside the toolbox's clock,
# report and ping, the operator verbs around it, and its part of the report.
version: '3'

vars:
  RECONCILE_HOURS: 168   # the full Proton walk, weekly; lib's toolbox `due` counts from the last complete one

# Run-scoped environment for every migrator command. RUN_BUDGET_MIN is a task var a run
# sets after the double dash (task sync -- RUN_BUDGET_MIN=30, or the workflow's vars
# input), mapped to the name the migrator reads; unset, it renders empty, which it reads
# as unset. RECONCILE, set the same way, is read by the toolbox's `due`, not the
# migrator. The migrator's work directory and config path are its own defaults, .run and
# config/mirror.toml, and AWS_REGION is an ENV line in the image, so every in-toolbox
# command sees it.
env:
  RUN_BUDGET_MIN: '{{.RUN_BUDGET_MIN}}'
  PROTON_DRIVE_LOG_LEVEL: INFO   # the Proton CLI's own log level; its lines reach the public job log

includes:
  toolbox:
    taskfile: https://raw.githubusercontent.com/katoptra/lib/v2/toolbox.yml
    flatten: true
    excludes: [report-mirror]
    vars:
      NAME: dropbox
      DESC: nightly Dropbox -> Proton Drive mirror; R2 holds the state
      PASS: MIRROR_VERBOSE
      MENU: >-
        ""
        "${c}read -- looks at Dropbox, Proton and R2, changes nothing${r}"
        "  task status               Counts and the last run's figures from the state in R2"
        ""
        "${c}checks -- offline, no credentials${r}"
        "  task run -- task offline  pytest, ruff check and ruff format --check"
        "  task fmt                  ruff format"
        ""
        "${c}write -- changes Proton Drive and the state in R2${r}"
        "  task sync -- RUN_BUDGET_MIN=30 RECONCILE=true"
        "                            ${d}a shorter budget; a forced Proton walk (the literal word true)${r}"
        "  task empty-trash          Permanently delete Proton trash (never scheduled)"
        "  task state-rollback -- k  Copy a history object over the canonical state"
        "                            ${d}with no key it lists the history${r}"
        "  task session-seal -- dir  Encrypt a laptop Proton CLI session into R2"
  # The proton engine supplies session, session-seal, empty-trash, and the pull and push
  # for lib's `due` and `reconciled`. This file has the tasks in the excludes: list.
  proton:
    taskfile: https://raw.githubusercontent.com/katoptra/lib/v2/engines/proton.yml
    flatten: true
    excludes: [pipeline, plan-pipeline, trash, empty-trash-pipeline, report-engine]

tasks:
  # ---- pipeline (runs inside the toolbox; each step is one migrator command) ----
  pipeline:
    desc: The full budgeted run, inside the toolbox
    cmds:
      - task: clock
      - task: due
      - task: clock-phase
      - task: session
      - task: state
      - task: inventory
      - task: delta
      - task: plan-phase
      - task: batches
      - task: trash
      - task: reconcile
      - task: report-phase
      - task: report
      - task: ping

  plan-pipeline:
    desc: Read-only half of the pipeline, inside the toolbox; prints the report it would make
    cmds:
      - task: clock
      - task: due
      - task: clock-phase
      - task: session
      - task: state
      - task: inventory
      - task: delta
      - task: plan-phase
      - python -m migrator report   # no --apply: a read-only plan pushes nothing to R2
      - cat {{.RUN}}/report.md

  # The stamp of the migrator, after the clock of the toolbox. It reads the start epoch from
  # .run/start.txt and writes it, with its hour and weekday, to .run/clock.json. It also
  # clears staging, the report and the walked marker.
  clock-phase: { internal: true, cmds: ['python -m migrator clock'] }
  state:      { internal: true, cmds: ['python -m migrator state'] }
  inventory:  { internal: true, cmds: ['python -m migrator inventory'] }
  delta:      { internal: true, cmds: ['python -m migrator delta'] }
  plan-phase: { internal: true, cmds: ['python -m migrator plan'] }
  batches:    { internal: true, cmds: ['python -m migrator --apply batches'] }
  trash:      { internal: true, cmds: ['python -m migrator --apply trash'] }
  reconcile:
    internal: true
    cmds:
      - python -m migrator --apply reconcile
      - task: record-walk
  # Only a complete walk is recorded; a partial one leaves the next run due, and it resumes.
  record-walk:
    internal: true
    status: ['test ! -f {{.RUN}}/walked']
    cmds: [{ task: reconciled }]
  # Builds .run/report.md from the state, closes the run row, writes the chain marker.
  report-phase: { internal: true, cmds: ['python -m migrator --apply report'] }
  # The empty-trash verb of the engine starts this task by name in the image, through
  # task op. go-task does not start an internal task from the command line. Thus, this
  # task is not internal.
  empty-trash-pipeline:
    cmds:
      - task: clock
      - task: clock-phase
      - task: session
      - task: state
      - python -m migrator --apply empty-trash

  # The toolbox's report calls this, then report-mirror. The pipeline of this mirror does
  # not include the engine's stage or confirm, and this task adds no engine rows.
  report-engine: {cmds: []}

  # The toolbox's report calls this after its own rows: at the end of the pipeline, and
  # from the failure path after a run that died anywhere. A run that died before its
  # report phase gets one now, closing the run row; then the report goes on the job page
  # under the toolbox's rows.
  report-mirror:
    internal: true
    cmds:
      - test -f {{.RUN}}/report.md || python -m migrator --apply report || true
      - test ! -f {{.RUN}}/report.md || cat {{.RUN}}/report.md >> "${GITHUB_STEP_SUMMARY:-/dev/stdout}"

  # ---- read ----
  status:
    desc: Counts from the state in R2
    cmds:
      - task: op
        vars: { ARGS: python -m migrator status }

  # ---- checks ----
  offline:
    desc: 'pytest, ruff check and ruff format --check, inside the toolbox: task run -- task offline'
    cmds:
      - python -m pytest
      - ruff check src tests
      - ruff format --check src tests
      # empty-trash starts empty-trash-pipeline by name in the image. A dry run shows that
      # go-task accepts that name from the command line.
      - task --dry empty-trash-pipeline >/dev/null 2>&1 || { echo "empty-trash-pipeline is internal" >&2; exit 1; }

  fmt:
    desc: ruff format
    cmds:
      - task run -- ruff format src tests

  # ---- write ----
  state-rollback:
    desc: 'Copy a history object over the canonical state: task state-rollback -- <key>'
    cmds:
      - task: op
        vars: { ARGS: 'python -m migrator state-rollback {{.CLI_ARGS}}' }
